name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Analysis, tests and Windows build
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          architecture: x64
          cache: 'false'

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Regression tests
        continue-on-error: true
        run: flutter test --no-pub --coverage

      - name: Compile USB helper
        run: dart compile exe bin/printer_worker.dart -o "$env:RUNNER_TEMP/fixma_pixma_worker.exe"

      - name: Compile queue helper
        run: dart compile exe bin/queue_worker.dart -o "$env:RUNNER_TEMP/fixma_pixma_queue.exe"

      - name: Compile update helper
        run: dart compile exe bin/update_worker.dart -o "$env:RUNNER_TEMP/fixma_pixma_updater.exe"

      - name: Compile Windows application
        run: flutter build windows --release --no-pub

      - name: Assemble portable application
        run: |
          $out = 'build/windows/x64/runner/Release'
          foreach ($name in @('fixma_pixma_worker.exe','fixma_pixma_queue.exe','fixma_pixma_updater.exe')) {
            Copy-Item (Join-Path $env:RUNNER_TEMP $name) $out
          }
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.txt -Destination $out
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $runtime = Get-ChildItem (Join-Path $vs 'VC/Redist/MSVC') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $crt = Get-ChildItem (Join-Path $runtime.FullName 'x64') -Directory | Where-Object Name -Like '*.CRT' | Select-Object -First 1
          foreach ($dll in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            Copy-Item (Join-Path $crt.FullName $dll) $out
          }
          Set-Content (Join-Path $out 'ZH-TW-BETA.txt') 'Unofficial Traditional Chinese beta. Not hardware validated.'
          Compress-Archive -Path "$out/*" -DestinationPath FixmaPixma-Windows-zh-TW-beta.zip -Force

      - name: Upload portable beta
        uses: actions/upload-artifact@v4
        with:
          name: FixmaPixma-Windows-zh-TW-beta
          path: FixmaPixma-Windows-zh-TW-beta.zip
          if-no-files-found: error
